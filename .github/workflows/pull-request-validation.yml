name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - version/**
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore CarriganSqlTools/CarriganSqlTools.sln

      - name: Build
        run: dotnet build CarriganSqlTools/CarriganSqlTools.sln --configuration Release --no-restore

      - name: BaseTests
        run: >-
          dotnet test --project CarriganSqlTools/Carrigan.SqlTools.Base.Tests/Carrigan.SqlTools.Base.Tests.csproj
          --configuration Release
          --no-build
          --coverlet
          --coverlet-output-format cobertura
          --report-xunit-trx
          --report-xunit-trx-filename test-results.trx
      - name: ClientsCoreTests
        run: >-
          dotnet test --project CarriganSqlTools/Carrigan.SqlTools.Clients.Core.Tests/Carrigan.SqlTools.Clients.Core.Tests.csproj
          --configuration Release
          --no-build
          --coverlet
          --coverlet-output-format cobertura
          --report-xunit-trx
          --report-xunit-trx-filename test-results.trx
      - name: ClientsPostgreSqlTests
        run: >-
          dotnet test --project CarriganSqlTools/Carrigan.SqlTools.Clients.PostgreSql.Tests/Carrigan.SqlTools.Clients.PostgreSql.Tests.csproj
          --configuration Release
          --no-build
          --coverlet
          --coverlet-output-format cobertura
          --report-xunit-trx
          --report-xunit-trx-filename test-results.trx
      - name: ClientsSqlServerTests
        run: >-
          dotnet test --project CarriganSqlTools/Carrigan.SqlTools.Clients.SqlServer.Tests/Carrigan.SqlTools.Clients.SqlServer.Tests.csproj
          --configuration Release
          --no-build
          --coverlet
          --coverlet-output-format cobertura
          --report-xunit-trx
          --report-xunit-trx-filename test-results.trx
      - name: GeneratorsPostgreSqlTests
        run: >-
          dotnet test --project CarriganSqlTools/Carrigan.SqlTools.Generators.PostgreSql.Tests/Carrigan.SqlTools.Generators.PostgreSql.Tests.csproj
          --configuration Release
          --no-build
          --coverlet
          --coverlet-output-format cobertura
          --report-xunit-trx
          --report-xunit-trx-filename test-results.trx
      - name: GeneratorsSqlServerTests
        run: >-
          dotnet test --project CarriganSqlTools/Carrigan.SqlTools.Generators.SqlServer.Tests/Carrigan.SqlTools.Generators.SqlServer.Tests.csproj
          --configuration Release
          --no-build
          --coverlet
          --coverlet-output-format cobertura
          --report-xunit-trx
          --report-xunit-trx-filename test-results.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.*.xml
          if-no-files-found: warn